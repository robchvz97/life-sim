<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache" />
<title>Life Sim v20</title>
<style>
  html,body{margin:0;height:100%;background:#101820;overflow:hidden;font:14px/1.4 system-ui,sans-serif}
  #hud{position:fixed;left:12px;top:12px;z-index:20;width:min(380px,calc(100vw - 24px));
    background:rgba(12,18,26,.92);color:#e8f0f7;border:1px solid #2a3c4e;border-radius:16px;padding:12px}
  #hud.hidden{width:auto;padding:8px}
  #hud.hidden .body{display:none}
  #top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #ver{color:#f0d78a;font-weight:800}
  button{font:inherit;color:#e8f0f7;background:#172434;border:1px solid #30465d;border-radius:10px;padding:8px 10px}
  #hide{width:36px;height:36px;padding:0;background:#1d4e78}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{color:#93a4b5;font-size:11px}
  .stat b{display:block;color:#e8f0f7;font-size:16px}
  #log{margin-top:8px;color:#b7c6d4;font-size:12px}
  #pad{position:fixed;left:16px;bottom:28px;width:112px;height:112px;border-radius:50%;z-index:20;
    background:rgba(16,28,40,.75);border:1px solid rgba(190,215,232,.35);touch-action:none}
  #knob{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(199,226,244,.35)}
  #home{position:fixed;left:140px;bottom:58px;z-index:20;width:46px;height:46px;border-radius:50%;padding:0}
</style>
</head>
<body>
<div id="hud">
  <div id="top"><span id="ver">v20.0.0</span><button id="hide">–</button></div>
  <div class="body">
    <h1 style="font-size:16px;margin:8px 0 4px">Life Sim — desde cero</h1>
    <p style="margin:0 0 8px;color:#93a4b5;font-size:12px">Terreno y cuerpos. La red mueve, abre la boca y emite una señal. No hay idioma ni grupos escritos.</p>
    <div class="grid">
      <div class="stat">Error predictivo<b id="mErr">—</b></div>
      <div class="stat">Neuronas<b id="mN">0</b></div>
      <div class="stat">Señales distintas<b id="mSig">0</b></div>
      <div class="stat">Señales parecidas<b id="mAlign">0%</b></div>
      <div class="stat">Cercanía<b id="mNear">0%</b></div>
      <div class="stat">Bloques puestos<b id="mBlocks">0</b></div>
    </div>
    <div style="margin-top:10px">
      <button id="pause">Pausar</button>
      <button id="speed">1×</button>
      <button id="reload">Actualizar</button>
    </div>
    <div id="log">8 cuerpos alrededor del centro. Dos dedos hacen zoom.</div>
  </div>
</div>
<div id="pad"><div id="knob"></div></div>
<button id="home">⌖</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const num = v => Number.isFinite(v) ? v : 0;
const rand = (a=0,b=1)=>a+Math.random()*(b-a);
const tanh = Math.tanh;
const WORLD = 24, N = 8;
const hud = document.getElementById('hud');
document.getElementById('hide').onclick = () => {
  const hidden = hud.classList.toggle('hidden');
  document.getElementById('hide').textContent = hidden ? '+' : '–';
};
if (innerWidth < 800) { hud.classList.add('hidden'); document.getElementById('hide').textContent = '+'; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 160);
const look = new THREE.Vector3(0, 1, 0);
let theta = 0.7, phi = 1.08, radius = 14, panX = 0, panZ = 0;
function aim(){
  const s = Math.sin(phi);
  camera.position.set(look.x + radius*s*Math.sin(theta), look.y + radius*Math.cos(phi), look.z + radius*s*Math.cos(theta));
  camera.lookAt(look);
}
aim();
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.7);
sun.position.set(8, 16, 6);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD*2, WORLD*2), new THREE.MeshStandardMaterial({color:0x24362f}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
scene.add(new THREE.GridHelper(WORLD*2, 24, 0x4d6b5c, 0x31483f));
const mark = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), new THREE.MeshBasicMaterial({color:0xf0d78a}));
mark.position.y = 0.3;
scene.add(mark);

let dragging = false, lx = 0, ly = 0, pinch = 0;
renderer.domElement.addEventListener('pointerdown', e => { if (e.target.closest('#hud,#pad,#home')) return; dragging = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX-lx)*0.005;
  phi = clamp(phi + (e.clientY-ly)*0.004, 0.4, 1.35);
  lx = e.clientX; ly = e.clientY; aim();
});
renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  if (pinch) radius = clamp(radius * (pinch/d), 5, 32);
  pinch = d; aim();
}, {passive:false});
renderer.domElement.addEventListener('touchend', () => pinch = 0);

const pad = document.getElementById('pad'), knob = document.getElementById('knob');
const setPad = (cx, cy) => {
  const r = pad.getBoundingClientRect();
  const x = clamp(cx - r.left - r.width/2, -34, 34);
  const y = clamp(cy - r.top - r.height/2, -34, 34);
  knob.style.transform = `translate(${x}px, ${y}px)`;
  panX = x/34; panZ = y/34;
};
const endPad = () => { panX = 0; panZ = 0; knob.style.transform = 'translate(0,0)'; };
pad.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; setPad(t.clientX, t.clientY); }, {passive:false});
pad.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; setPad(t.clientX, t.clientY); }, {passive:false});
pad.addEventListener('touchend', endPad);
pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); setPad(e.clientX, e.clientY); });
pad.addEventListener('pointermove', e => { if (pad.hasPointerCapture(e.pointerId)) setPad(e.clientX, e.clientY); });
pad.addEventListener('pointerup', endPad);
document.getElementById('home').onclick = () => { look.set(0,1,0); aim(); };

const blocks = [];
const box = new THREE.BoxGeometry(0.8, 0.8, 0.8);
function place(x, z, color){
  if (blocks.length > 200) return 0;
  const mesh = new THREE.Mesh(box, new THREE.MeshBasicMaterial({color}));
  const h = blocks.filter(b => b.x===x && b.z===z).length;
  if (h > 4) return 0;
  mesh.position.set(x, 0.4 + h*0.8, z);
  scene.add(mesh);
  blocks.push({x, z, mesh});
  return 1;
}

class Net {
  constructor(){
    this.nIn = 14; this.nH = 8; this.nOut = 8;
    this.w1 = Array.from({length:this.nH}, () => Array.from({length:this.nIn}, () => rand(-0.4,0.4)));
    this.w2 = Array.from({length:this.nOut}, () => Array.from({length:this.nH}, () => rand(-0.4,0.4)));
    this.e1 = this.w1.map(r => r.map(()=>0));
    this.e2 = this.w2.map(r => r.map(()=>0));
    this.pred = Array.from({length:4}, () => Array.from({length:this.nH}, () => rand(-0.2,0.2)));
    this.err = 0.6;
  }
  step(x){
    const h = this.w1.map(row => tanh(row.reduce((s,w,j)=>s+w*x[j],0)));
    const o = this.w2.map(row => tanh(row.reduce((s,w,j)=>s+w*h[j],0)));
    this._h = h;
    this._g = this.pred.map(row => tanh(row.reduce((s,w,j)=>s+w*h[j],0)));
    for (let i=0;i<this.nH;i++) for (let j=0;j<this.nIn;j++) this.e1[i][j] = 0.92*this.e1[i][j] + h[i]*x[j];
    for (let i=0;i<this.nOut;i++) for (let j=0;j<this.nH;j++) this.e2[i][j] = 0.92*this.e2[i][j] + o[i]*h[j];
    return o;
  }
  learn(reward, target){
    const r = clamp(reward,-1,1);
    for (let i=0;i<this.nOut;i++) for (let j=0;j<this.nH;j++) this.w2[i][j] = clamp(this.w2[i][j] + 0.03*r*this.e2[i][j], -2.5, 2.5);
    for (let i=0;i<this.nH;i++) for (let j=0;j<this.nIn;j++) this.w1[i][j] = clamp(this.w1[i][j] + 0.02*r*this.e1[i][j], -2.5, 2.5);
    let e = 0;
    for (let i=0;i<target.length;i++){
      const diff = target[i] - (this._g[i]||0);
      e += diff*diff;
      for (let j=0;j<this.nH;j++) this.pred[i][j] = clamp(this.pred[i][j] + 0.05*diff*this._h[j], -2, 2);
    }
    this.err = clamp(this.err*0.96 + e/target.length, 0, 3);
    if (this.err > 0.45 && this.nH < 16 && Math.random() < 0.01) this.grow();
  }
  grow(){
    this.w1.push(Array.from({length:this.nIn}, () => rand(-0.15,0.15)));
    this.e1.push(Array(this.nIn).fill(0));
    for (let i=0;i<this.nOut;i++){ this.w2[i].push(rand(-0.15,0.15)); this.e2[i].push(0); }
    for (const row of this.pred) row.push(rand(-0.1,0.1));
    this.nH++;
  }
}

function creature(hue){
  const g = new THREE.Group();
  const skin = new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(hue, 0.65, 0.55)});
  const dark = new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(hue, 0.4, 0.3)});
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); g.add(m); return m; };
  add(new THREE.BoxGeometry(0.7, 0.55, 0.4), skin, 0, 1.05, 0);
  const neck = add(new THREE.BoxGeometry(0.18, 0.22, 0.18), skin, 0, 1.42, 0);
  const head = add(new THREE.SphereGeometry(0.28, 14, 12), skin, 0, 1.78, 0);
  add(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({color:0x111111}), -0.1, 1.84, 0.22);
  add(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({color:0x111111}), 0.1, 1.84, 0.22);
  const mouth = add(new THREE.BoxGeometry(0.16, 0.05, 0.04), new THREE.MeshBasicMaterial({color:0xf0d78a}), 0, 1.66, 0.26);
  const armL = add(new THREE.BoxGeometry(0.12, 0.42, 0.12), dark, -0.46, 1.0, 0);
  const armR = add(new THREE.BoxGeometry(0.12, 0.42, 0.12), dark, 0.46, 1.0, 0);
  add(new THREE.SphereGeometry(0.09, 8, 8), dark, -0.46, 0.74, 0);
  add(new THREE.SphereGeometry(0.09, 8, 8), dark, 0.46, 0.74, 0);
  const legL = add(new THREE.BoxGeometry(0.14, 0.5, 0.14), dark, -0.18, 0.52, 0);
  const legR = add(new THREE.BoxGeometry(0.14, 0.5, 0.14), dark, 0.18, 0.52, 0);
  add(new THREE.BoxGeometry(0.18, 0.08, 0.26), dark, -0.18, 0.22, 0.04);
  add(new THREE.BoxGeometry(0.18, 0.08, 0.26), dark, 0.18, 0.22, 0.04);
  return { g, mouth, armL, armR, legL, legR, neck, head };
}

const agents = [];
for (let i = 0; i < N; i++){
  const hue = i / N;
  const body = creature(hue);
  const ang = (i/N)*Math.PI*2;
  body.g.position.set(Math.cos(ang)*2.4, 0, Math.sin(ang)*2.4);
  scene.add(body.g);
  agents.push({ ...body, net:new Net(), heading:ang+Math.PI, signal:[0,0,0,0], phase:rand(0,6), cool:0, color:new THREE.Color().setHSL(hue,0.7,0.55).getHex() });
}

function sense(a){
  let nx = 0, nz = 0, heard = [0,0,0,0], near = 0;
  for (const b of agents) if (b !== a){
    const d = a.g.position.distanceTo(b.g.position);
    if (d < 7){ nx += (b.g.position.x-a.g.position.x)/7; nz += (b.g.position.z-a.g.position.z)/7; near++; for (let i=0;i<4;i++) heard[i]+=b.signal[i]/(1+d); }
  }
  return [a.g.position.x/WORLD, a.g.position.z/WORLD, Math.sin(a.heading), Math.cos(a.heading), near/N, nx, nz, ...heard, a.signal[0], a.signal[1], a.phase/6];
}
function act(a, dt){
  const before = [a.g.position.x/WORLD, a.g.position.z/WORLD, a.signal[0], a.signal[1]];
  const o = a.net.step(sense(a));
  a.heading += o[0]*dt*1.4;
  const stride = Math.max(0, o[1]);
  a.g.position.x = clamp(a.g.position.x + Math.sin(a.heading)*(0.4+stride*1.3)*dt, -WORLD+1, WORLD-1);
  a.g.position.z = clamp(a.g.position.z + Math.cos(a.heading)*(0.4+stride*1.3)*dt, -WORLD+1, WORLD-1);
  a.g.rotation.y = a.heading;
  a.phase += (0.4+stride)*dt*6;
  const swing = Math.sin(a.phase)*stride;
  a.legL.rotation.x = swing; a.legR.rotation.x = -swing;
  a.armL.rotation.x = -swing*0.8; a.armR.rotation.x = swing*0.8;
  a.mouth.scale.y = 1 + Math.max(0, o[2])*3;
  a.signal = [o[4], o[5], o[6], o[7]].map(v => clamp(v,-1,1));
  a.head.material = a.head.material; 
  a.cool -= dt;
  let placed = 0;
  if (a.cool <= 0 && o[3] > 0.45){
    placed = place(Math.round(a.g.position.x+Math.sin(a.heading)), Math.round(a.g.position.z+Math.cos(a.heading)), a.color);
    a.cool = 0.8;
  }
  const after = [a.g.position.x/WORLD, a.g.position.z/WORLD, a.signal[0], a.signal[1]];
  const changed = after.reduce((s,v,i)=>s+Math.abs(v-before[i]),0);
  const surprise = after.reduce((s,v,i)=>s+Math.abs(v-(a.net._g[i]||0)),0);
  a.net.learn(placed*0.25 + changed*0.35 - surprise*0.15, after);
}
function bins(){
  const s = new Set();
  for (const a of agents) s.add(a.signal.map(v => Math.round(v*2)).join(','));
  return s.size;
}
function align(){
  let s = 0, n = 0;
  for (let i=0;i<agents.length;i++) for (let j=i+1;j<agents.length;j++){
    if (agents[i].g.position.distanceTo(agents[j].g.position) > 5) continue;
    let dot = 0;
    for (let k=0;k<4;k++) dot += agents[i].signal[k]*agents[j].signal[k];
    s += clamp(dot/4,0,1); n++;
  }
  return n ? s/n : 0;
}
function near(){
  let c = 0, n = 0;
  for (let i=0;i<agents.length;i++) for (let j=i+1;j<agents.length;j++){ n++; if (agents[i].g.position.distanceTo(agents[j].g.position) < 3) c++; }
  return n ? c/n : 0;
}
let paused = false, speed = 1, acc = 0, last = performance.now(), sample = 0;
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Seguir' : 'Pausar'; };
document.getElementById('speed').onclick = e => { speed = speed===1?3:1; e.target.textContent = speed+'×'; };
document.getElementById('reload').onclick = () => location.replace('https://robchvz97.github.io/life-sim/?v='+Date.now());
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  if (Math.abs(panX)+Math.abs(panZ) > 0.05){
    look.x = clamp(look.x + (panX*Math.cos(theta) + panZ*Math.sin(theta))*dt*12, -WORLD, WORLD);
    look.z = clamp(look.z + (panX*-Math.sin(theta) + panZ*Math.cos(theta))*dt*12, -WORLD, WORLD);
  } else if (agents.length){
    look.x += (agents.reduce((s,a)=>s+a.g.position.x,0)/agents.length - look.x)*0.03;
    look.z += (agents.reduce((s,a)=>s+a.g.position.z,0)/agents.length - look.z)*0.03;
  }
  aim();
  acc += dt * (paused?0:speed);
  while (acc > 0.05){ for (const a of agents) act(a, 0.05); acc -= 0.05; }
  sample += dt;
  if (sample > 1){
    sample = 0;
    const err = num(agents.reduce((s,a)=>s+num(a.net.err),0)/(agents.length||1));
    const neurons = num(agents.reduce((s,a)=>s+a.net.nH,0)/(agents.length||1));
    document.getElementById('mErr').textContent = err.toFixed(3);
    document.getElementById('mN').textContent = neurons.toFixed(1);
    document.getElementById('mSig').textContent = bins();
    document.getElementById('mAlign').textContent = Math.round(num(align())*100)+'%';
    document.getElementById('mNear').textContent = Math.round(near()*100)+'%';
    document.getElementById('mBlocks').textContent = blocks.length;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
